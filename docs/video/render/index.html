<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Combo — 60-second film</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { max-width: 1200px; margin: auto; padding: 16px; }
    canvas, video { display: block; width: 100%; aspect-ratio: 16 / 9; }
    canvas[hidden], video[hidden] { display: none; }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 16px 0; }
    button { font: inherit; padding: 8px 16px; }
    #progress { flex: 1; min-width: 180px; }
    p { margin: 8px 0; }
  </style>
</head>
<body>
  <main>
    <canvas id="film" width="1920" height="1080" aria-label="Combo animated film preview"></canvas>
    <video id="finished" controls hidden aria-label="Rendered Combo film"></video>
    <nav>
      <button id="play" disabled>Play preview</button>
      <button id="render" disabled>Render video</button>
      <input id="progress" type="range" min="0" max="60" step="0.1" value="0" aria-label="Video position">
      <output id="time">00:00 / 01:00</output>
      <a id="download" hidden>Download MP4</a>
    </nav>
    <p id="status" role="status">Loading images and narration…</p>
    <p>60-second motion storyboard · animated titles · draft narration · original instrumental bed</p>
  </main>
  <script type="module" src="film.js"></script>
</body>
</html>
