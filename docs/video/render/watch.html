<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Combo — finished video</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { max-width: 1280px; margin: auto; padding: 16px; }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; }
    nav { display: flex; gap: 20px; align-items: center; padding: 16px 0; }
    button { font: inherit; padding: 8px 16px; }
  </style>
</head>
<body>
  <main>
    <video id="video" src="combo-film.mp4" controls playsinline preload="auto" aria-label="Combo one-minute film"></video>
    <nav>
      <button id="play">Play film</button>
      <a href="combo-film.mp4" download>Download MP4</a>
      <a href="/">Edit / render</a>
    </nav>
    <p>1080p · Animated storyboard with draft narration and original music</p>
  </main>
  <script>
    const video = document.querySelector('#video');
    document.querySelector('#play').addEventListener('click', () => { video.currentTime = 0; video.play(); });
  </script>
</body>
</html>
